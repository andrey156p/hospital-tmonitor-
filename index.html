<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מערכת ניטור טמפרטורה</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container" id="app-container">
        <h1>דיווח טמפרטורה יומי</h1>

        <div id="setup-section">
            <div class="card">
                <label>שם הבודק:</label>
                <input type="text" id="inspector-name" placeholder="הכנס שם מלא">
                
                <label>בחר משמרת:</label>
                <select id="shift-select">
                    <option value="בוקר">בוקר (Утро)</option>
                    <option value="צהריים">צהריים (День)</option>
                    <option value="ערב">ערב (Вечер)</option>
                </select>
                <button class="main-btn" onclick="startCheck()">התחל בדיקה</button>
            </div>
        </div>

        <div id="check-section" class="hidden">
            <div class="card">
                <div class="progress-bar"><span id="progress-text"></span></div>
                <h2 id="current-dept-name"></h2>
                
                <div class="input-group">
                    <label>1. חדר אוכל:</label>
                    <input type="number" id="temp-dining" step="0.1" inputmode="decimal">
                </div>
                
                <div class="input-group">
                    <label>2. חדר ממוצע (2 חדרים):</label>
                    <input type="number" id="temp-rooms" step="0.1" inputmode="decimal">
                </div>
                
                <div class="input-group">
                    <label>הערות:</label>
                    <textarea id="notes" rows="2"></textarea>
                </div>
                
                <button class="main-btn" onclick="saveAndNext()">שמור והמשך</button>
            </div>
        </div>

        <div id="report-section" class="hidden">
            <div class="card">
                <h3>הנתונים נשלחו בהצלחה!</h3>
                <div class="chart-container">
                    <canvas id="tempChart"></canvas>
                </div>
                
                <button class="export-btn" onclick="exportToExcel()">הורד דוח אקסל</button>
                <button class="auto-btn" onclick="autoGenerate()">מילוי אוטומטי (ממוצע)</button>
                <button class="reset-btn" onclick="location.reload()">בדיקה חדשה</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
